name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: apps/api
        run: ruff check .

      - name: Backend tests
        working-directory: apps/api
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend
        working-directory: apps/web
        run: npm install

      - name: Frontend lint
        working-directory: apps/web
        run: npm run lint

      - name: Frontend build
        working-directory: apps/web
        run: npm run build
